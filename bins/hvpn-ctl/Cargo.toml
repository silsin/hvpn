[package]
name = "hvpn-ctl"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hvpn-ctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1.0.115"
serde = { version = "1.0.197", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
