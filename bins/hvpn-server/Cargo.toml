[package]
name    = "hvpn-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hvpn-server"
path = "src/main.rs"

[dependencies]
hvpn-common    = { path = "../../crates/hvpn-common" }
hvpn-crypto    = { path = "../../crates/hvpn-crypto" }
hvpn-core      = { path = "../../crates/hvpn-core" }
hvpn-obfs      = { path = "../../crates/hvpn-obfs" }
hvpn-tun       = { path = "../../crates/hvpn-tun" }
tokio          = { workspace = true }
tokio-tungstenite = { workspace = true }
rustls         = { workspace = true }
rustls-pemfile = { workspace = true }
clap           = { workspace = true }
anyhow         = { workspace = true }
tracing        = { workspace = true }
tracing-subscriber = { workspace = true }
futures-util   = { workspace = true }
dashmap        = "5.5.3"
http           = "1.1.0"
serde_json     = { workspace = true }
reqwest        = { version = "0.12.4", features = ["blocking", "rustls-tls"], default-features = false }
qrcode         = "0.14.1"
base64         = "0.22.1"
x25519-dalek   = { workspace = true }
rand           = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.153"
