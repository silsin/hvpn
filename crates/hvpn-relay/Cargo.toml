[package]
name = "hvpn-relay"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
hvpn-crypto = { path = "../hvpn-crypto" }
hvpn-common = { path = "../hvpn-common" }
hvpn-transport = { path = "../hvpn-transport" }
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
